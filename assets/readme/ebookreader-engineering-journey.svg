<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">EbookReader v2 engineering journey</title>
<desc id="desc">From product contracts and multi-format architecture through hardening, runtime closure, clean Windows acceptance, and v2.0.0 release.</desc>
<rect width="1600" height="520" rx="32" fill="#f4f1e8"/>
