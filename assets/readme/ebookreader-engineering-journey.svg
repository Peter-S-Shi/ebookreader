<text x="80" y="124" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#65716c">A released desktop product built through explicit contracts, verification gates, and packaged acceptance.</text>

<line x1="120" y1="285" x2="1480" y2="285" stroke="#b7c0ba" stroke-width="6" stroke-linecap="round"/>

