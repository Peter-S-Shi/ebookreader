<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">EbookReader</title>
  <desc id="desc">A quiet, local-first reading workspace for Windows.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7F3EC"/>
      <stop offset="100%" stop-color="#EEF2F4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#18324A" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="1600" height="720" rx="34" fill="url(#bg)"/>
  <circle cx="122" cy="112" r="40" fill="#DCE5EB"/>
  <text x="122" y="123" text-anchor="middle" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="26" font-weight="700" fill="#3D6E9E">ER</text>

  <text x="88" y="240" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="76" font-weight="700" fill="#18202A">EbookReader</text>
  <text x="90" y="302" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="28" font-weight="400" fill="#43515C">A Windows-first, local-first personal reading workspace.</text>
  <text x="90" y="353" font-family="Georgia, 'Times New Roman', serif"
        font-size="26" font-style="italic" fill="#5F6B73">Quiet Surface, Living Motion.</text>

  <g font-family="Segoe UI, Inter, Arial, sans-serif" font-size="18" font-weight="600">
    <rect x="90" y="408" width="128" height="46" rx="23" fill="#E5EBEF" stroke="#CAD5DD"/>
    <text x="154" y="438" text-anchor="middle" fill="#344A5D">Windows</text>
    <rect x="230" y="408" width="138" height="46" rx="23" fill="#E5EBEF" stroke="#CAD5DD"/>
    <text x="299" y="438" text-anchor="middle" fill="#344A5D">Local-first</text>
    <rect x="380" y="408" width="182" height="46" rx="23" fill="#E5EBEF" stroke="#CAD5DD"/>
    <text x="471" y="438" text-anchor="middle" fill="#344A5D">EPUB · PDF · TXT</text>
    <rect x="574" y="408" width="154" height="46" rx="23" fill="#E5EBEF" stroke="#CAD5DD"/>
    <text x="651" y="438" text-anchor="middle" fill="#344A5D">Optional OCR</text>
  </g>

  <text x="92" y="520" font-family="Segoe UI, Inter, Arial, sans-serif"
        font-size="21" fill="#6B747A">Read · Annotate · Align · Plan · Recover</text>
  <rect x="90" y="562" width="124" height="6" rx="3" fill="#3D6E9E"/>

  <!-- Abstract product motifs: books, bilingual alignment, planning formula -->
  <g filter="url(#shadow)">
    <rect x="930" y="112" width="460" height="420" rx="26" fill="#FFFDF8" stroke="#D8D4CB"/>
    <rect x="868" y="170" width="430" height="390" rx="24" fill="#FDFBF6" stroke="#D8D4CB"/>
    <rect x="1004" y="228" width="430" height="360" rx="24" fill="#FFFFFF" stroke="#D2D9DE"/>
  </g>

  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="908" y="218" font-size="18" font-weight="700" fill="#3D6E9E">Library</text>
    <line x1="908" y1="245" x2="1235" y2="245" stroke="#CAD3D8"/>
    <line x1="908" y1="278" x2="1210" y2="278" stroke="#CAD3D8"/>
    <line x1="908" y1="311" x2="1180" y2="311" stroke="#CAD3D8"/>
    <rect x="908" y="352" width="92" height="132" rx="10" fill="#385873"/>
    <rect x="1018" y="352" width="92" height="132" rx="10" fill="#506B80"/>
    <rect x="1128" y="352" width="92" height="132" rx="10" fill="#6D8290"/>

    <text x="1045" y="278" font-size="16" font-weight="700" fill="#24445E">EN</text>
    <text x="1045" y="314" font-size="16" fill="#6A7379">Morning Library</text>
    <text x="1256" y="278" font-size="16" font-weight="700" fill="#24445E">中</text>
    <text x="1256" y="314" font-size="16" fill="#6A7379">清晨的图书馆</text>

    <text x="1048" y="410" font-size="16" font-weight="700" fill="#3D6E9E">Book Hours</text>
    <text x="1048" y="446" font-size="16" fill="#5C6870">Quantity ÷ Speed × Difficulty</text>
    <rect x="1048" y="474" width="260" height="10" rx="5" fill="#E1E6E9"/>
    <rect x="1048" y="474" width="172" height="10" rx="5" fill="#3D6E9E"/>
    <text x="1048" y="520" font-size="15" fill="#6A7379">Planning stays separate from reading facts.</text>
  </g>
</svg>
