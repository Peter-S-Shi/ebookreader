[package]
name = "ebookreader-domain"
version = "0.1.0"
description = "EbookReader domain/application logic — no Tauri or GUI dependency, so tests never need to link the desktop-shell dependency graph."
edition = "2021"

[dependencies]
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
