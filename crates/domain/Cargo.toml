[package]
name = "ebookreader-domain"
version = "0.1.0"
description = "EbookReader domain/application logic — no Tauri or GUI dependency, so tests never need to link the desktop-shell dependency graph."
edition = "2021"

[dependencies]
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = "0.25"
imageproc = "0.27"
geo = "0.28"
geo-clipper = "0.9"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
